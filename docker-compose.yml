# ─────────────────────────────────────────────────────────────────────────────
#  RagVault (AI Knowledge Hub) — Docker Compose
#  Services: postgres | chromadb | backend | frontend
#  Answer generation is delegated to a cloud LLM over an OpenAI-compatible API
#  (DeepSeek by default). No local model server and no GGUF download required.
#  One-click setup: docker compose up -d
# ─────────────────────────────────────────────────────────────────────────────

networks:
  hub_net:
    driver: bridge

volumes:
  postgres_data:
  chroma_data:
  hf_cache:
  uploads_temp:

services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: hub_postgres
    restart: unless-stopped
    networks:
      - hub_net
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-knowledge_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pg_sec_9d3f82a7b1c4e650}
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_hub}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-knowledge_user} -d ${POSTGRES_DB:-knowledge_hub}",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    ports:
      # Host 5433 → container 5432 (host already runs PostgreSQL 18 on 5432).
      # Container-internal connections still use postgres:5432.
      - "5433:5432" # Expose for local dev

  # ── ChromaDB ───────────────────────────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:0.5.18
    container_name: hub_chromadb
    restart: unless-stopped
    networks:
      - hub_net
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma_data
      - ANONYMIZED_TELEMETRY=FALSE
    volumes:
      - chroma_data:/chroma_data
    ports:
      - "8001:8000" # Expose for local dev inspection

  # ── Backend (FastAPI + FastEmbed ONNX, LLM calls go out to the cloud) ───────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hub_backend
    restart: unless-stopped
    networks:
      - hub_net
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://knowledge_user:pg_sec_9d3f82a7b1c4e650@postgres:5432/knowledge_hub}
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      # Cloud LLM (OpenAI-compatible). LLM_API_KEY comes from .env.
      - LLM_PROVIDER=${LLM_PROVIDER:-deepseek}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com/v1}
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
      # Language of the UI copy and of every AI-generated answer: "en" or "zh".
      # The browser switcher overrides this per visitor via X-App-Language.
      - APP_LANGUAGE=${APP_LANGUAGE:-en}
      - HF_HOME=/hf_cache
    volumes:
      - ./backend:/app
      - uploads_temp:/uploads/temp
      - hf_cache:/hf_cache
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c ''import urllib.request; urllib.request.urlopen("http://localhost:8000/health")''',
        ]

  # ── Frontend (React + Vite, served via Nginx ~45MB) ─────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hub_frontend
    restart: unless-stopped
    networks:
      - hub_net
    depends_on:
      - backend
    ports:
      - "3000:80"

  # ── Nginx Reverse Proxy (optional profile) ─────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: hub_nginx
    profiles:
      - nginx
    restart: unless-stopped
    networks:
      - hub_net
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
